version: 2
project_name: lazyclash
before:
  hooks:
    - sh scripts/release-completions.sh
builds:
  - id: lazyclash
    main: ./cmd/lazyclash
    binary: lazyclash
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    # Preserve linker/VCS build metadata for offline release provenance inspection.
    flags: [-buildvcs=true]
    ldflags:
      - -s -w -X github.com/daviddwlee84/lazyclash/internal/cli.Version=v{{ .Version }} -X github.com/daviddwlee84/lazyclash/internal/selfupdate.ReleaseStamp=archive-v1:v{{ .Version }}
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - completions/lazyclash.bash
      - completions/lazyclash.zsh
checksum:
  name_template: checksums.txt
release:
  draft: true
changelog:
  use: git
