name: test
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Test immutable release publication
        run: python3 -m unittest discover -s scripts -p test_release.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test source and module packaging guards
        run: python3 -m unittest discover -s scripts -p test_distribution.py
      - name: Build independently extracted source and Go module distributions
        run: python3 scripts/check-distribution.py
      - name: Install Linux verification dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh bubblewrap openssh-server
          sudo mkdir -p /run/sshd
      - name: Enable namespace isolation on the disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          if ! bwrap --unshare-net --ro-bind / / -- /bin/true; then
            # This is only the ephemeral GitHub-hosted test VM. The updater
            # and rule service never change a user's namespace/AppArmor policy.
            if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
            if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
              sudo sysctl -w kernel.unprivileged_userns_clone=1
            fi
          fi
          bwrap --unshare-net --ro-bind / / -- /bin/true
      - run: go vet ./...
      - run: go test -race ./...
        env:
          LAZYCLASH_REQUIRE_NATIVE_ISOLATION: "1"
          LAZYCLASH_REQUIRE_SSH_ISOLATION: "1"
      - name: Exercise an actual managed native core and TUN on the disposable Linux VM
        if: runner.os == 'Linux'
        timeout-minutes: 8
        env:
          LAZYCLASH_NATIVE_INTEGRATION: "1"
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: go test ./internal/managedcore -run '^TestNativeLinuxManagedAcceptance$' -count=1 -v -timeout=7m
      - run: go build -o bin/lazyclash ./cmd/lazyclash
      - run: go build -o bin/fakecore ./tools/fakecore
      - name: Exercise completion in a real isolated zsh
        run: python3 scripts/completion_pty_smoke.py
      - name: Exercise reverse SSH with an isolated server and real terminals
        env:
          LAZYCLASH_REQUIRE_SSH_ISOLATION: "1"
        run: python3 scripts/reverse_pty_smoke.py
      - name: Exercise a real terminal with isolated controllers
        run: |
          python3 -m venv "$RUNNER_TEMP/pty-venv"
          "$RUNNER_TEMP/pty-venv/bin/pip" install pyte==0.8.2
          "$RUNNER_TEMP/pty-venv/bin/python" scripts/pty_smoke.py
          "$RUNNER_TEMP/pty-venv/bin/python" scripts/auth_pty_smoke.py
          "$RUNNER_TEMP/pty-venv/bin/python" scripts/tools_pty_smoke.py
          "$RUNNER_TEMP/pty-venv/bin/python" scripts/pty_servers_smoke.py
          "$RUNNER_TEMP/pty-venv/bin/python" scripts/pty_tailnet_smoke.py
          "$RUNNER_TEMP/pty-venv/bin/python" scripts/pty_cloud_vps_smoke.py
  servers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Exercise official cores and authenticated tunnels in disposable containers
        env:
          LAZYCLASH_SERVER_INTEGRATION: "1"
          LAZYCLASH_SERVER_E2E: "1"
          LAZYCLASH_SERVER_NGINX: "1"
        run: go test ./internal/serverdeploy -run '^TestIntegration' -count=1 -v -timeout=18m
