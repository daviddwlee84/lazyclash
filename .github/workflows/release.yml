name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish or verify
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate immutable stable tag on main
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
      - name: Load publisher from the tested workflow revision
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: git show "${WORKFLOW_SHA}:scripts/release.py" > "$RUNNER_TEMP/release-publisher.py"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --clean --skip=publish,announce
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify payloads and native binary
        run: python3 "$RUNNER_TEMP/release-publisher.py" check --project lazyclash --binary lazyclash --tag "$RELEASE_TAG" --smoke
      - name: Verify native archive provenance offline
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
          RELEASE_BINARY: ${{ github.workspace }}/dist/lazyclash_linux_amd64_v1/lazyclash
        run: go test ./internal/selfupdate -run '^TestReleaseArtifact$' -count=1 -v
      - name: Publish only a complete, verified release
        run: python3 "$RUNNER_TEMP/release-publisher.py" publish --project lazyclash --binary lazyclash --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Request Homebrew tap formula sync
        # The tap's hourly schedule is delayed by GitHub; ask it to sync now.
        # github.token cannot dispatch another repository's workflow, so this
        # needs a fine-grained token with Actions write on homebrew-tap only.
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_DISPATCH_TOKEN is not set; the tap syncs on its hourly schedule"
            exit 0
          fi
          GH_TOKEN="$TAP_TOKEN" gh workflow run sync.yml -R daviddwlee84/homebrew-tap -f tool=lazyclash \
            || echo "::warning::Homebrew tap sync dispatch failed; the tap syncs on its hourly schedule"
